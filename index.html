<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maple &amp; Pearl · Autumn Boba Stand</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1a2c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --panel:rgba(255,247,232,.9);--panel-2:#fff1d8;--ink:#4a2c1d;--ink-2:#8a6249;--line:rgba(74,44,29,.14);
  --chip:#ffe6bf;--accent:#e9782a;--ok:#3f9b57;--bad:#d14a3a;--shadow:0 12px 34px rgba(58,22,8,.32);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--panel:rgba(44,28,48,.88);--panel-2:#33213a;--ink:#ffeccf;--ink-2:#d1b199;--line:rgba(255,236,207,.16);--chip:#46304d;--ok:#7fdc95;--bad:#ff8b7a;--shadow:0 12px 34px rgba(0,0,0,.5)}
}
:root[data-theme="dark"]{--panel:rgba(44,28,48,.88);--panel-2:#33213a;--ink:#ffeccf;--ink-2:#d1b199;--line:rgba(255,236,207,.16);--chip:#46304d;--ok:#7fdc95;--bad:#ff8b7a;--shadow:0 12px 34px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#2a1a2c;color:var(--ink);font-family:'Nunito',ui-rounded,'Trebuchet MS',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.fred{font-family:'Fredoka','Nunito',ui-rounded,system-ui,sans-serif}
.glass{background:var(--panel);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);border:1px solid var(--line);box-shadow:var(--shadow)}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none;z-index:5}
.left{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.brand{display:flex;gap:10px;align-items:center;padding:7px 14px 7px 8px;border-radius:18px}
.logo{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#ffb45c,#e9642a);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.brand b{display:block;font:600 16px/1.05 'Fredoka',ui-rounded,sans-serif}
.brand small{display:block;font-size:11px;color:var(--ink-2);font-weight:700;margin-top:2px}
.cozy{padding:8px 12px 9px;border-radius:14px;width:min(230px,58vw)}
.cozy .t{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:800;color:var(--ink-2);margin-bottom:6px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb45c,#e9642a);border-radius:9px;transition:width .6s ease}
.right{display:flex;gap:8px;align-items:center;pointer-events:auto}
.pill{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;font-weight:800;font-size:14px}
.ib{width:40px;height:40px;border-radius:14px;font-size:18px;cursor:pointer;display:grid;place-items:center;color:var(--ink);padding:0}
.ib:focus-visible,.btn:focus-visible,.cta:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#bubble{position:fixed;left:0;top:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .3s;will-change:transform}
#bubble.on{opacity:1}
#bubble .card{position:relative;padding:10px 13px 11px;border-radius:18px;max-width:min(270px,78vw);min-width:150px;margin-bottom:10px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
#bubble .card::after{content:'';position:absolute;left:50%;bottom:-8px;width:15px;height:15px;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg);border-radius:0 0 4px 0}
#bubble .who{font:600 14px/1.1 'Fredoka',sans-serif}
#bubble .say{font-size:12px;color:var(--ink-2);font-weight:700;margin-top:3px;line-height:1.25}
.chips{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;font:800 12px/1 'Nunito',sans-serif;padding:5px 9px 5px 6px;border-radius:999px;background:var(--chip);transition:background .2s}
.chip .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-2);display:grid;place-items:center;font-size:9px;line-height:1}
.chip.neg .dot{border-style:dashed}
.chip.ok{background:rgba(63,155,87,.2)}
.chip.ok .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.bad{background:rgba(209,74,58,.2)}
.chip.bad .dot{border-color:var(--bad);color:var(--bad)}
.react{text-align:center;padding:2px 4px}
.react .stars{font-size:22px;letter-spacing:3px;color:#f2a51f}
.react .line{font-size:13px;font-weight:800;margin-top:2px}
.react .tip{font:600 15px 'Fredoka',sans-serif;color:var(--accent);margin-top:4px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dock-h,120px) + 18px + env(safe-area-inset-bottom,0px));padding:8px 16px;border-radius:999px;font-weight:800;font-size:13px;z-index:5;white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#toast{position:fixed;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);opacity:0;padding:9px 16px;border-radius:999px;font-weight:800;font-size:13px;z-index:9;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 24px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#dock{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(1000px,calc(100% - 16px));z-index:6;border-radius:24px;padding:8px}
.dock-in{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
.dock-in::-webkit-scrollbar{display:none}
.grp{flex:0 0 auto;background:var(--panel-2);border-radius:18px;padding:6px 8px 8px;border:1px solid var(--line)}
.grp .lb{font:700 11px/1 'Nunito',sans-serif;color:var(--ink-2);margin:2px 2px 6px}
.row{display:flex;gap:6px}
.btn{position:relative;width:64px;height:60px;border-radius:15px;border:0;background:var(--chip);color:var(--ink);font:800 11px/1.05 'Nunito',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;box-shadow:0 3px 0 rgba(74,44,29,.2);transition:transform .08s,box-shadow .08s,opacity .2s;padding:0}
.btn:active,.btn.holding{transform:translateY(2px);box-shadow:0 1px 0 rgba(74,44,29,.2)}
.btn.off{opacity:.4}
.btn .ic{font-size:22px;line-height:1}
.btn kbd{position:absolute;top:3px;right:5px;font:800 9px 'Nunito',sans-serif;opacity:.4}
.btn.tea .sw{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.6),transparent 40%),var(--c);box-shadow:inset 0 -4px 6px rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.2)}
.btn.tea.sel{outline:3px solid var(--accent);outline-offset:-3px}
.btn.go{background:linear-gradient(180deg,#ffb45c,#ea6a2b);color:#fff;box-shadow:0 3px 0 #b0431a;width:76px}
.btn.go.off{background:var(--chip);color:var(--ink)}
.btn.sm{width:48px}
#start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 100%,rgba(255,150,70,.35),rgba(30,16,36,.8));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .7s,visibility .7s}
#start.gone{opacity:0;visibility:hidden}
#start .card{width:min(430px,92vw);text-align:center;padding:30px 26px 24px;border-radius:30px}
#start h1{margin:6px 0 4px;font:700 40px/1 'Fredoka',sans-serif;color:#c8421f}
#start p{margin:0 auto 18px;max-width:34ch;font-weight:700;color:var(--ink-2);line-height:1.4;font-size:15px}
#start .big{font-size:54px;line-height:1;display:inline-block;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(4deg)}}
.cta{display:block;width:100%;border:0;border-radius:18px;padding:15px;font:600 18px 'Fredoka',sans-serif;color:#fff;cursor:pointer;background:linear-gradient(180deg,#ffb45c,#ea6a2b);box-shadow:0 4px 0 #b0431a}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 #b0431a}
.ghost{margin-top:12px;background:none;border:0;color:var(--ink-2);font:800 13px 'Nunito',sans-serif;cursor:pointer;text-decoration:underline}
#fatal{position:fixed;inset:0;display:none;place-items:center;z-index:50;background:#2a1a2c;color:#ffeccf;text-align:center;padding:24px;font-weight:700}
@media (max-width:560px){.btn{width:58px;height:56px}.brand small{display:none}#start h1{font-size:34px}}
@media (prefers-reduced-motion:reduce){#start .big{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="left">
    <div class="brand glass"><div class="logo">🍁</div><div><b>Maple &amp; Pearl</b><small>Autumn boba stand</small></div></div>
    <div class="cozy glass"><div class="t"><span id="cozyLbl">Cozy level</span><span id="cozyNext"></span></div><div class="bar"><i id="cozyBar"></i></div></div>
  </div>
  <div class="right">
    <div class="pill glass" title="Drinks served">🧋 <span id="served">0</span></div>
    <div class="pill glass" title="Tips collected">🍂 <span id="tips">0</span></div>
    <button class="ib glass" id="mood" aria-label="Change time of day" title="Change time of day">🌇</button>
    <button class="ib glass" id="sound" aria-label="Toggle sound" title="Sound">🔊</button>
  </div>
</div>
<div id="bubble"><div class="card"><div class="who fred" id="bWho"></div><div class="say" id="bSay"></div><ul class="chips" id="bChips"></ul><div id="bReact"></div></div></div>
<div id="toast" class="glass"></div>
<div id="hint" class="glass"></div>
<div id="dock" class="glass"><div class="dock-in" id="dockIn"></div></div>
<div id="start"><div class="card glass"><div class="big">🧋</div><h1>Maple &amp; Pearl</h1><p>A quiet boba stand under falling leaves. Pour, scoop, top and serve. No timers, no rush.</p><button class="cta" id="go">Open the stand</button><button class="ghost" id="quiet">Play without sound</button></div></div>
<div id="fatal"><p></p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const THREE = window.THREE;
const $ = s => document.querySelector(s);
function fatal(m){const f=$('#fatal');f.style.display='grid';f.querySelector('p').textContent=m}
if(!THREE){fatal('The 3D engine could not load. Check your connection and reload.');return}

/* ---------- helpers ---------- */
const TAU=Math.PI*2;
const C=h=>new THREE.Color(h).convertSRGBToLinear();
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
const easeLinear=t=>t,easeIn=t=>t*t,easeOutCubic=t=>1-Math.pow(1-t,3);
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- data ---------- */
const TEAS=[
 {id:'milk',name:'Milk tea',hex:0xc9955c,css:'#c9955c'},
 {id:'matcha',name:'Matcha',hex:0x86ab47,css:'#86ab47'},
 {id:'taro',name:'Taro',hex:0xb797dd,css:'#b797dd'},
 {id:'hojicha',name:'Hojicha',hex:0x94572f,css:'#94572f'},
 {id:'chai',name:'Pumpkin chai',hex:0xe58a2c,css:'#e58a2c'}];
const TOPS=[
 {id:'foam',name:'Cream foam',ic:'☁️',key:'f'},
 {id:'cinn',name:'Cinnamon',ic:'🍂',key:'c'},
 {id:'maple',name:'Maple drizzle',ic:'🍁',key:'m'}];
const teaById=id=>TEAS.find(t=>t.id===id), topById=id=>TOPS.find(t=>t.id===id);
const CRITTERS=[
 {name:'Kit the Fox',body:0xe9772e,belly:0xfff0d8,ear:'tri',tail:'fox',scarf:0x3f7a8c},
 {name:'Bramble the Bear',body:0x8b5a3c,belly:0xd9b48a,ear:'round',scarf:0xc23b2e},
 {name:'Clover the Bunny',body:0xf1e6da,belly:0xffffff,ear:'long',scarf:0xe8a33a},
 {name:'Miso the Cat',body:0x9aa0a6,belly:0xeef0f2,ear:'tri',tail:'cat',scarf:0xd96a4a},
 {name:'Chestnut the Tanuki',body:0x6b5647,belly:0xd8c3a5,ear:'round',mask:true,scarf:0x5d8a4a}];
const GREET=['One autumn treat, please!','Leaves are falling, boba is calling.','Something cozy, if you have it.','I could smell this stand from the park.','The usual, but fancier.'];
const UNLOCKS=[{at:2,id:'pumpkins',label:'Pumpkin patch',ic:'🎃'},{at:6,id:'lanterns',label:'More lanterns',ic:'🏮'},{at:11,id:'fireflies',label:'Fireflies',ic:'✨'},{at:17,id:'cat',label:'Sleepy cat',ic:'🐈'}];
const cup={tea:null,level:0,pearls:0,scoops:0,ice:0,tops:new Set(),sealed:false,busy:false};
const stats={served:0,tips:0,cozy:0};
const SAVE='maple-pearl-v1';
try{const s=JSON.parse(localStorage.getItem(SAVE)||'null');if(s){stats.served=s.served|0;stats.tips=s.tips|0;stats.cozy=s.cozy|0}}catch(e){}
const saveStats=()=>{try{localStorage.setItem(SAVE,JSON.stringify(stats))}catch(e){}};
let started=false,pouring=false,pourBtn=null,cust=null;

/* ---------- renderer ---------- */
const canvas=$('#c');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'})}catch(e){fatal('Your browser could not start WebGL.');return}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(C(0xf9cf98),16,90);
const camera=new THREE.PerspectiveCamera(42,1,.1,400);

/* ---------- environment map (for shiny bits) ---------- */
let envTex=null;
try{
  const es=new THREE.Scene(),g=new THREE.SphereGeometry(20,32,16),pos=g.attributes.position,cols=[];
  const top=new THREE.Color(.5,.6,.78),mid=new THREE.Color(1,.78,.55),bot=new THREE.Color(.2,.14,.1),c=new THREE.Color();
  for(let i=0;i<pos.count;i++){const y=pos.getY(i)/20;if(y>0)c.copy(mid).lerp(top,Math.pow(y,.6));else c.copy(mid).lerp(bot,Math.min(1,-y*2.5));cols.push(c.r,c.g,c.b)}
  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  es.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
  const p1=new THREE.Mesh(new THREE.PlaneGeometry(9,6),new THREE.MeshBasicMaterial({color:new THREE.Color(5,4,3),side:THREE.DoubleSide}));
  p1.position.set(-10,9,10);p1.lookAt(0,0,0);es.add(p1);
  const p2=new THREE.Mesh(new THREE.PlaneGeometry(6,4),new THREE.MeshBasicMaterial({color:new THREE.Color(1.2,1.5,2.2),side:THREE.DoubleSide}));
  p2.position.set(12,6,-6);p2.lookAt(0,0,0);es.add(p2);
  const pm=new THREE.PMREMGenerator(renderer);envTex=pm.fromScene(es,.03).texture;pm.dispose();
}catch(e){envTex=null}
const shiny=[];
const S=(m,k)=>{if(envTex)m.envMap=envTex;m.envMapIntensity=k||1;m.userData.envBase=m.envMapIntensity;shiny.push(m);return m};
const M=(hex,o)=>new THREE.MeshStandardMaterial(Object.assign({color:C(hex),roughness:.8,metalness:0},o||{}));

/* ---------- textures ---------- */
function canvasTex(w,h,draw,rep){const cv=document.createElement('canvas');cv.width=w;cv.height=h;draw(cv.getContext('2d'),w,h);const t=new THREE.CanvasTexture(cv);if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping}t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
function blotchTex(base,blots,count){return canvasTex(512,512,(g,w)=>{g.fillStyle=base;g.fillRect(0,0,w,w);for(let i=0;i<count;i++){g.globalAlpha=rand(.05,.22);g.fillStyle=pick(blots);const r=rand(2,16),x=rand(0,w),y=rand(0,w),rot=rand(0,6.28),k=rand(.4,1);for(const dx of [-w,0,w])for(const dy of [-w,0,w]){g.beginPath();g.ellipse(x+dx,y+dy,r,r*k,rot,0,TAU);g.fill()}}g.globalAlpha=1},true)}
function plankTex(base,line){return canvasTex(256,256,(g)=>{g.fillStyle=base;g.fillRect(0,0,256,256);for(let i=0;i<4;i++){g.fillStyle='rgba(0,0,0,'+rand(.03,.09)+')';g.fillRect(0,i*64,256,64);g.fillStyle=line;g.fillRect(0,i*64,256,3)}for(let i=0;i<260;i++){g.strokeStyle='rgba(60,30,10,'+rand(.04,.12)+')';g.lineWidth=rand(.5,1.6);const x=rand(0,256),y=rand(0,256);g.beginPath();g.moveTo(x,y);g.lineTo(x+rand(20,90),y+rand(-2,2));g.stroke()}},true)}
function stripeTex(c1,c2){return canvasTex(128,8,(g)=>{g.fillStyle=c1;g.fillRect(0,0,64,8);g.fillStyle=c2;g.fillRect(64,0,64,8)},true)}
const glowTex=canvasTex(128,128,(g)=>{const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,'rgba(255,255,255,.5)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,128,128)});
const blobTex=canvasTex(128,128,(g)=>{const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(0,0,0,.55)');r.addColorStop(.6,'rgba(0,0,0,.2)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,128,128)});
const heartTex=canvasTex(128,128,(g)=>{g.fillStyle='#ff7a9a';g.beginPath();g.moveTo(64,112);g.bezierCurveTo(8,72,14,20,64,46);g.bezierCurveTo(114,20,120,72,64,112);g.fill()});
const starTex=canvasTex(128,128,(g)=>{g.fillStyle='#ffd25a';g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?26:58;g.lineTo(64+Math.cos(a)*r,64+Math.sin(a)*r)}g.closePath();g.fill()});
const zTex=canvasTex(64,64,(g)=>{g.fillStyle='#fff';g.font='bold 54px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('z',32,34)});
const cloudTex=canvasTex(256,128,(g)=>{for(let i=0;i<9;i++){const x=rand(50,206),y=rand(50,80),r=rand(28,50),gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,256,128)}});
const moonTex=canvasTex(128,128,(g)=>{const r=g.createRadialGradient(64,64,20,64,64,62);r.addColorStop(0,'rgba(255,250,230,1)');r.addColorStop(.55,'rgba(255,250,230,1)');r.addColorStop(.62,'rgba(255,250,230,.25)');r.addColorStop(1,'rgba(255,250,230,0)');g.fillStyle=r;g.fillRect(0,0,128,128)});

/* ---------- lights ---------- */
const hemi=new THREE.HemisphereLight(0xffffff,0x886644,.8);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1);sun.position.set(-8,10,9);sun.target.position.set(0,0,-2);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:50});
sun.shadow.camera.updateProjectionMatrix();sun.shadow.bias=-.0005;sun.shadow.normalBias=.03;scene.add(sun,sun.target);
const rim=new THREE.DirectionalLight(C(0xffb27a),.35);rim.position.set(6,5,-12);scene.add(rim);
const lamp=new THREE.PointLight(C(0xffb570),.3,13,2);lamp.position.set(.2,2.7,.6);scene.add(lamp);

/* ---------- sky ---------- */
